<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GaplessPlayer">
  <rect width="512" height="512" rx="112" fill="#1b1f30"/>
  <rect x="3" y="3" width="506" height="506" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>

  <!-- 左半段波形：向接缝收束 -->
  <g stroke="#8A7BFF" stroke-width="28" stroke-linecap="round">
    <path d="M92 256 v-38"/>
    <path d="M142 256 v-94"/>
    <path d="M192 256 v-58"/>
    <path d="M234 256 v-16"/>
  </g>

  <!-- 右半段波形：从接缝重新展开 -->
  <g stroke="#3ECF9E" stroke-width="28" stroke-linecap="round">
    <path d="M278 256 v-16"/>
    <path d="M320 256 v-58"/>
    <path d="M370 256 v-94"/>
    <path d="M420 256 v-38"/>
  </g>

  <!-- 接缝：两段之间零间隙 -->
  <path d="M256 146 v220" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
  <path d="M256 146 v220" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="34" stroke-linecap="round"/>

  <!-- 底部：零间隙标记 -->
  <path d="M152 388 h208" stroke="#ffffff" stroke-opacity="0.30" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="388" r="14" fill="#FFFFFF" fill-opacity="0.9"/>
</svg>
